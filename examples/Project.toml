# Without the path source, the documented `julia --project=./examples`
# resolves ExaModelsPower from the registry rather than from this checkout, and
# the example then calls entry points the released version does not have. A
# package's own `[sources]` applies only while it is the ACTIVE project, so the
# MadNLP pin in test/Project.toml is repeated here (same SHA, same reason).
[sources]
ExaModelsPower = {path = ".."}
MadNLP = {rev = "059c2f62a3d22bfd96f84b0701793a4e228ddd5f", url = "https://github.com/MadNLP/MadNLP.jl"}
