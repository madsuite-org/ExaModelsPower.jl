name = "ExaModelsPower"
uuid = "2fff4b78-0b6c-428d-bac8-85ccea8c4bdf"
version = "0.4.5"

[deps]
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
ExaModels = "1037b233-b668-4ce9-9b63-f9f681f55dd2"
ExaPowerIO = "14903efe-9500-4d7f-a589-7ab7e15da6de"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
PowerIO = "05ed8b54-f668-4096-9d0d-e8c3dd9dc169"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"

[weakdeps]
# Never loaded; listed only so the [compat] bound below applies when the
# resolver pulls it in transitively (see there).
TimerOutputs = "a759f4b9-e2f1-59dc-863e-4aeb61b1ea8f"
AMDGPU = "21141c5a-9bdb-4563-92ae-f87d6854732e"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"
oneAPI = "8f75cd03-7ff8-4ecb-9b8f-daf728133b1b"
ExaModelsCompiler = "3d1e9a26-5b74-4f0c-9a2b-7c8f4e11d3a7"

[extensions]
ExaModelsPowerAMDGPUExt = ["AMDGPU", "ExaModels", "KernelAbstractions"]
ExaModelsPowerCUDAExt = ["CUDA", "ExaModels", "KernelAbstractions"]
ExaModelsPowerKernelAbstractionsExt = ["ExaModels", "KernelAbstractions"]
ExaModelsPowerMetalExt = ["Metal", "ExaModels", "KernelAbstractions"]
ExaModelsPoweroneAPIExt = ["oneAPI", "ExaModels", "KernelAbstractions"]
ExaModelsPowerExaModelsCompilerExt = "ExaModelsCompiler"

[compat]
AMDGPU = "2"
CUDA = "6"
KernelAbstractions = "0.9, 0.10"
Metal = "1.9"
oneAPI = "2"
PrecompileTools = "1"
# TimerOutputs 1.x depends on PrettyTables 3, which depends on REPL. With REPL in
# the environment, Pkg (here through LazyArtifacts) loads its REPLExt, and
# `juliac --trim=safe` rejects that extension with ~40 verifier errors, so
# `compile_all` fails. LinearOperators 2.14.3 (via NLPModels) admits TimerOutputs 1;
# holding it at 0.5 keeps REPL out of the compiled library's environment.
TimerOutputs = "0.5"
ExaModels = "0.12, 0.13, 0.14"
ExaModelsCompiler = "0.1.1"
# 0.3.1 rather than 0.3: v0.3.0 builds `bus_map` from an untyped `[]` narrowed
# by its `Vector{Int}` annotation, and the resulting
# `convert(Vector{Int64}, ::Vector{Any})` copies through a dynamic `setindex!`
# that `juliac --trim=safe` will not resolve. Resolving to it makes
# `compile_all` fail on four verifier errors that all bottom out in that one
# conversion, so the floor is a build requirement, not a preference.
ExaPowerIO = "0.3.1"
JSON = "0.21"
PowerIO = "0.11.6"
julia = "1.11"
